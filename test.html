function openVolumeControl(pcId) {
    _volumePcId = pcId;

    document.getElementById("volume-target-label").innerText = label;

    if (!_volumePcId) return;
    const vol = parseInt(document.getElementById("volume-slider").value);
    const scalar = vol / 100.0;
    
    if (_volumePcId === "__ALL__") {
        writeCommandToDB("__ALL__", "volume_control", { level: scalar });
        alert("전체 PC에 음량 " + vol + "% 설정 명령을 보냈습니다.");

        writeCommandToDB(_volumePcId, "volume_control", { level: scalar });
        alert("해당 PC에 음량 " + vol + "% 설정 명령을 보냈습니다.");
    }
    
    closeVolumeModal();
}

function getPCDiffSeconds(pc, serverNowMs) {
    const lastSeenRaw = pc.last_seen_ts || 0;
    if (lastSeenRaw <= 0) return 999999;
    // 하위 호환성 유지: 초 단위 타임스탬프인 경우 밀리초 단위로 변환
    const lastSeenMs = lastSeenRaw > 1e11 ? lastSeenRaw : lastSeenRaw * 1000;
    return Math.max(0, (serverNowMs - lastSeenMs) / 1000.0);
}

            else timeStr = `${Math.floor(diffSeconds / 3600)}시간 전`;
            
            try {

                const hrs = String(calibratedDate.getHours()).padStart(2, '0');

function updateStatistics(serverNowMs) {
    if (!serverNowMs) serverNowMs = Date.now() + serverTimeOffset;
    const pcKeys = Object.keys(pcs);
    const total = pcKeys.length;
    
    const online = pcKeys.filter(k => {
        const pc = pcs[k];
        const diffSeconds = getPCDiffSeconds(pc, serverNowMs);
        return (pc.status === "online") && (diffSeconds < 30);
    }).length;
    const offline = total - online;
    
    document.getElementById("stat-total").innerText = total;
    document.getElementById("stat-online").innerText = online;
    document.getElementById("stat-offline").innerText = offline;
}

    }
    
    const pc = pcs[pcId];
    if (!pc) return;

    // PC가 보고한 로컬 config 로드 (없을 시 빈값 처리)
    const cfg = pc.config || {};
    const school = cfg.school_info || {};
    
    
    document.getElementById("cfg-minutes-before").value = cfg.minutes_before !== undefined ? cfg.minutes_before : 5;
    document.getElementById("cfg-autostart").checked = cfg.autostart !== undefined ? cfg.autostart : true;
    document.getElementById("cfg-popup-alert").checked = cfg.show_popup_alert !== undefined ? cfg.show_popup_alert : false;

    // 요일 스케줄 데이터 Deep Copy 및 로드
    cfgActiveSchedule = {};
    DAYS_LIST.forEach(day => {
        cfgActiveSchedule[day] = {};
        const daySchedule = cfg[day] || {};
        
        PERIODS_LIST.forEach(period => {
            let sanitizedPeriod = period;
            [".", "$", "#", "[", "]", "/"].forEach(char => {
                sanitizedPeriod = sanitizedPeriod.replaceAll(char, "_");
            });
            const periodData = daySchedule[period] || daySchedule[sanitizedPeriod] || {};
            cfgActiveSchedule[day][period] = {
                enabled: periodData.enabled !== undefined ? periodData.enabled : false,
                action: periodData.action || "시스템 종료"
            };
        });
    });
    
    // 요일 탭 버튼 및 스케줄 초기 렌더링 ("월")
    renderScheduleTabs("월");
    
    document.getElementById("config-modal").classList.add("show");

// 승인 여부만 확인하는 헬퍼 함수 (관리자 승인 체크용)
async function _isApproved(uid) {
    try {
        const snap = await firebase.database().ref("/users/" + uid + "/approved").once("value");
        return snap.val() === true;
    } catch(e) {
        console.error("_isApproved error:", e);
        return false;
    }

async function _checkAuthPermission() {
    if (!_fbAuth || !_fbAuth.currentUser) {
        alert("로그인이 필요합니다.");
        signOutAndReset();
        return false;
    }
    const user = _fbAuth.currentUser;
    if (user.email === MASTER_EMAIL) return true;
    
    try {
        const snap = await firebase.database().ref("/users/" + user.uid + "/approved").once("value");
        const isApproved = snap.val();
        if (isApproved !== true) {
            alert("보안 경고: 계정의 접근 권한이 박탈되었습니다.");
            _revokeAccess();
            return false;
        }
        return true;
    } catch(e) {
        alert("권한 확인 중 오류가 발생했습니다.");
        return false;
    }
}

async function _checkAdminPermission() {
    if (!_fbAuth || !_fbAuth.currentUser) {
        alert("로그인이 필요합니다.");
        signOutAndReset();
        return false;
    }
    if (_fbAuth.currentUser.email !== MASTER_EMAIL) {
        alert("보안 경고: 관리자 권한이 없습니다.");
        return false;
    }

}

async function applyRemoteConfig() {
    if (!(await _checkAuthPermission())) return;
    if (!activeConfigTarget) return;
    
    const minutesBefore = parseInt(document.getElementById("cfg-minutes-before").value) || 5;
    const autostart = document.getElementById("cfg-autostart").checked;
    const popupAlert = document.getElementById("cfg-popup-alert").checked;
    
    const schoolName = document.getElementById("cfg-school-name").value.trim();
    const officeCode = document.getElementById("cfg-office-code").value.trim();
    const schoolKind = document.getElementById("cfg-school-kind").value;
    const grade = document.getElementById("cfg-grade").value.trim();
    const classNm = document.getElementById("cfg-class").value.trim();
    const apiKey = document.getElementById("cfg-api-key").value.trim();

    
    
    
    // Firebase 키 이름 제한 우회: 요일 스케줄 데이터의 키 슬래시(/)를 언더바(_)로 치환하여 Sanitization
    const sanitizedSchedule = {};
    for (const day in cfgActiveSchedule) {
        sanitizedSchedule[day] = {};
        for (const period in cfgActiveSchedule[day]) {
            const cleanPeriod = period.replace("/", "_"); // '방과후/기타' -> '방과후_기타'
            sanitizedSchedule[day][cleanPeriod] = cfgActiveSchedule[day][period];
        }
    }
    
    // 기본 설정 + 학교 정보 + 요일별 교시 스케줄 병합하여 Payload 구성
    const configPayload = {
        minutes_before: minutesBefore,
        autostart: autostart,
        show_popup_alert: popupAlert,
        school_info: {
            name: schoolName,
            office_code: officeCode,
            school_kind: schoolKind,
            grade: grade,
            class_nm: classNm,
            api_key: apiKey
        },

        ...sanitizedSchedule // 슬래시가 제거된 스케줄 데이터 주입!
    };
    
    showModal(
        "원격 설정 변경 확인",
        `[${pcs[activeConfigTarget].hostname || activeConfigTarget}] PC의 환경설정 및 자동 종료 스케줄을 즉시 원격 변경하여 적용하시겠습니까?`,
        async () => {
            const targetPc = activeConfigTarget;
            closeModal();
            closeConfigModal();
            
            const result = await writeCommandToDB(targetPc, "set_config", configPayload);
            if (result.success) {
                alert("원격 설정 및 종료 스케줄 변경 명령이 성공적으로 전송되었습니다! PC가 수초 내에 이를 적용합니다.");
            } else {
                alert("설정 전송 중 오류가 발생했습니다: " + result.error);
            }
            selectedPcs.clear();
            updateStatistics();
        }
    );
}


// ── 전원 제어 명령 작성 기능 ──
async function writeCommandToDB(target, action, message = "") {
    if (!(await _checkAuthPermission())) return;
    
    const bodyData = {
        action: action,
        message: message,
        timestamp: Date.now() / 1000.0
    };
    
    try {
        if (target === "__ALL__") {
            await firebase.database().ref("/commands/__ALL__").set(bodyData);
        } else {
            await firebase.database().ref("/commands/" + target).push(bodyData);
        }
        return { success: true };
    } catch (e) {
        console.error("writeCommandToDB error:", e);
        if (e.code === 'PERMISSION_DENIED') {
            alert("명령 전송 실패: 권한이 없습니다 (관리자 로그인 필요).");
        } else {
            alert("명령 전송 실패: " + e.message);
        }
        return { success: false };
    }
}

const FAV_STORAGE_KEY = "sp_file_favorites";
let openFileTarget = null;
let expectedExplorerPath = ""; // '__ALL__' 또는 특정 pcId

/** 즐겨찾기 배열 읽기 */
function loadFavorites() {
    try {
        return JSON.parse(localStorage.getItem(FAV_STORAGE_KEY)) || [];
    } catch(e) { return []; }
}

/** 즐겨찾기 배열 저장 */
function saveFavorites(favs) {
    localStorage.setItem(FAV_STORAGE_KEY, JSON.stringify(favs));
    syncFavoritesToFirebase(favs); // Firebase 원격 실시간 동기화
}

/** Firebase RTDB로 즐겨찾기 업로드 */
async function syncFavoritesToFirebase(favs) {
    if (!(await _checkAuthPermission())) return;
    try {
        await firebase.database().ref("/file_favorites").set(favs);
    } catch(e) {
        console.error("즐겨찾기 저장 실패:", e);
    }
}

/** Firebase RTDB로부터 즐겨찾기 다운로드 및 로컬 갱신 */
async function loadFavoritesFromServer() {
    if (!openFileTarget || openFileTarget === "__ALL__") return;
    try {
        const snap = await firebase.database().ref("/explorer_favorites/" + openFileTarget).once("value");
        const favs = snap.val();
        if (favs && Array.isArray(favs)) {
            localStorage.setItem(FAV_STORAGE_KEY, JSON.stringify(favs));
            renderFavorites();
        }
    } catch (e) {
        console.error("즐겨찾기 로드 실패:", e);
    }
}

/** 즐겨찾기 목록 UI 렌더링 */
function renderFavorites() {

    const emptyEl = document.getElementById("fav-empty");

                </div>

            </div>
            <button onclick="loadFavorite(${idx})" style="
                background: rgba(79,70,229,0.2); border: 1px solid var(--primary);
                color: var(--text-main); padding: 4px 8px; border-radius: 6px;
                font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap;
                transition: var(--transition-smooth);" title="이 즐겨찾기로 입력 채우기">불러오기</button>
            <button onclick="deleteFavorite(${idx})" style="
                background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
                color: var(--danger); padding: 4px 8px; border-radius: 6px;
                font-size: 11px; font-weight: 700; cursor: pointer;
                transition: var(--transition-smooth);" title="즐겨찾기 삭제">🗑</button>
        </div>
    `).join("");
}

/** 즐겨찾기 항목 불러오기 (입력란에 채우기) */
function loadFavorite(idx) {
    const favs = loadFavorites();
    if (!favs[idx]) return;
    const fav = favs[idx];
    document.getElementById("of-file-path").value = fav.file_path || "";
    document.getElementById("of-app-path").value  = fav.app_path  || "";
    document.getElementById("of-fav-name").value  = fav.name      || "";
}

/** 즐겨찾기 삭제 */
function deleteFavorite(idx) {
    const favs = loadFavorites();
    favs.splice(idx, 1);
    saveFavorites(favs);
    renderFavorites();
}

/** 현재 입력값을 즐겨찾기에 저장 */
function addFavoriteFromInputs() {
    const name     = document.getElementById("of-fav-name").value.trim();
    const filePath = document.getElementById("of-file-path").value.trim();
    const appPath  = document.getElementById("of-app-path").value.trim();

    if (!filePath) {
        alert("파일 경로를 먼저 입력해 주세요.");
        return;
    }
    if (!name) {
        alert("즐겨찾기 이름을 입력해 주세요.");
        return;
    }
    const favs = loadFavorites();
    // 중복 파일 경로 + 앱 경로 조합이면 덮어쓰기
    const existingIdx = favs.findIndex(f => f.file_path === filePath && f.app_path === appPath);
    if (existingIdx !== -1) {
        favs[existingIdx].name = name;
    } else {
        favs.push({ name, file_path: filePath, app_path: appPath });
    }
    saveFavorites(favs);
    renderFavorites();
    alert(`"${name}" 즐겨찾기에 저장되었습니다.`);
}

/** HTML 이스케이프 유틸 */
function escHtml(str) {
    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}

/** 파일 열기 모달 열기 (개별 PC 또는 '__ALL__') */

let explorerInterval = null;
let currentExplorerPath = "";

function loadExplorerPath(path = null) {
    const targetPath = path !== null ? path : document.getElementById("explorer-path").value.trim();
    const finalPath = targetPath || "DRIVES";
    expectedExplorerPath = finalPath; // Set the expected path
    
    document.getElementById("explorer-list").innerHTML = '<div style="text-align: center; padding-top: 80px; font-size: 12px;">로딩 중...</div>';

    writeCommandToDB(openFileTarget, "list_dir", { path: finalPath }).then(() => {
        if (!explorerInterval) {
            explorerInterval = setInterval(pollExplorerData, 1000);
        }
    });
}

function normalizePath(p) {
    if (!p) return p;
    return p.replace(/\//g, '\\').toUpperCase();
}

function pollExplorerData() {
    if (!openFileTarget || openFileTarget === "__ALL__") return;
    
    firebase.database().ref("/explorer/" + openFileTarget).once("value").then(snap => {
        const data = snap.val();
        if (data) {
            const gotNorm = normalizePath(data.path);
            const expNorm = normalizePath(expectedExplorerPath);
            if (expectedExplorerPath && gotNorm !== expNorm) {
                const container = document.getElementById("explorer-list");
                if (container && container.innerHTML.includes("로딩 중")) {
                    container.innerHTML = `<div style="text-align: center; padding-top: 80px; font-size: 12px;">데이터 수집 중...<br><br><span style="color:var(--text-muted); font-size:10px;">[Wait] expected: '${escapeHtml(expectedExplorerPath)}', got: '${escapeHtml(data.path)}'</span></div>`;
                }
                return;
            }
            renderExplorerList(data);
        }
    }).catch(e => console.error("Explorer poll error:", e));
}

function renderExplorerList(data) {
    const container = document.getElementById("explorer-list");
    const pathInput = document.getElementById("explorer-path");
    if (data.path && document.activeElement !== pathInput) {
        pathInput.value = data.path;
    }
    
    if (data.error) {
        container.innerHTML = `<div style="color:var(--danger); padding:10px; font-size:12px;">오류: ${escapeHtml(data.error)}</div>`;
        return;
    }
    
    if (!data.items || data.items.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding-top:80px; font-size:12px;">빈 폴더입니다.</div>';
        return;
    }
    
    let html = '';
    data.items.forEach(item => {
        const isFolder = item.type === "folder";
        const icon = isFolder ? "📁" : "📄";
        const sizeStr = isFolder ? "" : (item.size > 1024*1024 ? (item.size/(1024*1024)).toFixed(1)+'MB' : Math.ceil(item.size/1024)+'KB');
        
        const safeName = item.name.replace(/\\/g, "\\\\").replace(/'/g, "\\\'").replace(/"/g, "&quot;");
        
        html += `
            <div style="display:flex; justify-content:space-between; padding:6px 8px; border-bottom:1px solid var(--border-light); cursor:pointer; font-size:12px;"
                 onmouseover="this.style.background='var(--hover-bg)'" onmouseout="this.style.background='transparent'"
                 onclick="selectExplorerItem('${safeName}', ${isFolder})">
                <div style="display:flex; gap:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                    <span>${icon}</span>
                    <span>${item.name}</span>
                </div>
                <div style="color:var(--text-muted); flex-shrink:0;">${sizeStr}</div>
            </div>
        `;
    });
    
    container.innerHTML = html;
    currentExplorerPath = data.path || "";
    
    if (data.status === "done") {
        if (explorerInterval) {
            clearInterval(explorerInterval);
            explorerInterval = null;
        }
    }
}

function explorerGoUp() {
    if (!currentExplorerPath) return;
    let parts = currentExplorerPath.replace(/\\$/, "").split("\\");
    if (parts.length <= 1) {
        loadExplorerPath("DRIVES");
    } else {
        parts.pop();
        let upPath = parts.join("\\");
        if (upPath.length === 2 && upPath.endsWith(":")) upPath += "\\";
        loadExplorerPath(upPath);
    }
}

function selectExplorerItem(name, isFolder) {
    if (isFolder) {
        let newPath = "";
        if (currentExplorerPath === "DRIVES" || !currentExplorerPath) {
            newPath = name;
        } else {
            let base = currentExplorerPath.endsWith("\\") ? currentExplorerPath : currentExplorerPath + "\\";
            newPath = base + name;
        }
        loadExplorerPath(newPath);
    } else {
        let filePath = "";
        if (currentExplorerPath === "DRIVES" || !currentExplorerPath) return;
        let base = currentExplorerPath.endsWith("\\") ? currentExplorerPath : currentExplorerPath + "\\";
        filePath = base + name;
        document.getElementById("of-file-path").value = filePath;
    }
}

async function handleEmailAuth() {
    const email = document.getElementById("auth-email-input").value.trim();
    const pw = document.getElementById("auth-pw-input").value;
    const msg = document.getElementById("auth-error-msg");

        return;

        } else {
            msg.textContent = _translateAuthError(err.code);
        }
        msg.style.display = "block";
    }
}

    try {
        const provider = new firebase.auth.GoogleAuthProvider();
        await _fbAuth.signInWithPopup(provider);
        // onAuthStateChanged가 처리 (Google 계정은 기본 인증됨)
    } catch(err) {
        _showErr(_fbErrKo(err.code) || err.message);
    }
}

// ─ 비밀번호 재설정 ───────────────────────────────────────
async function handlePasswordReset() {
    if (!_fbAuth) return;
    const email = (document.getElementById("auth-email-input").value || "").trim();
    if (!email) { _showErr("위에 이메일을 입력한 후 눌러주세요."); return; }
    try {
        await _fbAuth.sendPasswordResetEmail(email);
        alert("비밀번호 재설정 이메일이 발송되었습니다. 메일함을 확인해주세요.");
    } catch(err) { _showErr(_fbErrKo(err.code) || err.message); }
}

// ─ 이메일 인증 확인 (1단계 완료 체크) ───────────────────
async function checkEmailVerified() {
    if (!_fbAuth || !_fbAuth.currentUser) return;
    try {
        await _fbAuth.currentUser.reload();
        if (_fbAuth.currentUser.emailVerified) {
            // 인증 완료 → 2단계(관리자 승인) 확인
            const approved = await _isApproved(_fbAuth.currentUser.uid);
            if (approved) {
                _enterDashboard(_fbAuth.currentUser);
            } else {
                await _savePending(_fbAuth.currentUser);
                document.getElementById("pending-email-label").textContent = _fbAuth.currentUser.email;
                _showScreen("pending-view");
            }
        } else {
            alert("아직 이메일 인증이 완료되지 않았습니다.\n메일함에서 인증 링크를 클릭해주세요.");
        }
    } catch(e) { alert("오류: " + e.message); }
}

async function resendVerificationEmail() {
    if (!_fbAuth || !_fbAuth.currentUser) return;
    try {
        await _fbAuth.currentUser.sendEmailVerification();
        alert("인증 이메일을 재발송했습니다. 메일함을 확인해주세요.");
    } catch(e) { alert("오류: " + e.message); }
}

// ─ 관리자 승인 확인 (2단계 완료 체크) ──────────────────
async function checkPendingApproval() {
    if (!_fbAuth || !_fbAuth.currentUser) return;
    const user = _fbAuth.currentUser;
    const approved = await _isApproved(user.uid);
    if (approved) {
        _enterDashboard(user);
    } else {
        alert("아직 관리자 승인 대기 중입니다.\n관리자에게 문의해주세요.");
    }
}

// ─ 로그아웃 ──────────────────────────────────────────────
async function signOutAndReset() {
    try {
        if (_fbAuth) await _fbAuth.signOut();
        const lb = document.getElementById("logout-header-btn");
        const ab = document.getElementById("admin-panel-btn");
        if (lb) lb.style.display = "none";
        if (ab) ab.style.display = "none";
        closeAdminPanel();
        if (pollerInterval) clearInterval(pollerInterval);
        
        if (_revokedListener && _fbAuth && _fbAuth.currentUser && window.firebase && firebase.database) {
            firebase.database().ref("/users/" + _fbAuth.currentUser.uid + "/approved").off("value", _revokedListener);
            _revokedListener = null;
        }
        
        _showScreen("auth-view");
    } catch(e) { console.error(e); }
}

// ─ 관리자 패널 ───────────────────────────────────────────

let _revokedListener = null;

let adminPendingListener = null;
let adminUsersListener = null;

function detachAdminListeners() {
    if (adminPendingListener && window.firebase && firebase.database) {
        firebase.database().ref("/pending_users").off("value", adminPendingListener);
        adminPendingListener = null;
    }
    if (adminUsersListener && window.firebase && firebase.database) {
        firebase.database().ref("/users").off("value", adminUsersListener);
        adminUsersListener = null;
    }
}

function switchAdminTab(tab) {
    detachAdminListeners();
    
    const btnPending = document.getElementById('tab-btn-pending');
    const btnApproved = document.getElementById('tab-btn-approved');
    const viewPending = document.getElementById('admin-tab-pending');
    const viewApproved = document.getElementById('admin-tab-approved');
    
    if (tab === 'pending') {
        btnPending.style.borderBottomColor = 'var(--primary)';
        btnPending.style.color = 'var(--text-main)';
        btnApproved.style.borderBottomColor = 'transparent';
        btnApproved.style.color = 'var(--text-muted)';
        viewPending.style.display = 'block';
        viewApproved.style.display = 'none';
        loadPendingUsers();
    } else {
        btnApproved.style.borderBottomColor = 'var(--primary)';
        btnApproved.style.color = 'var(--text-main)';
        btnPending.style.borderBottomColor = 'transparent';
        btnPending.style.color = 'var(--text-muted)';
        viewPending.style.display = 'none';
        viewApproved.style.display = 'block';
        loadApprovedUsers();
    }
}

function _revokeAccess() {
    if (pollerInterval) clearInterval(pollerInterval);
    document.querySelectorAll('button').forEach(b => b.disabled = true);
    // Except logout and re-request
    const authCard = document.querySelector('#revoked-view .auth-card');
    if (authCard) {
        authCard.querySelectorAll('button').forEach(b => b.disabled = false);
    }
    _showScreen("revoked-view");
}

function loadApprovedUsers() {
    const listEl = document.getElementById("approved-user-list");
    
    if (adminUsersListener) return;
    
    listEl.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:20px 0;">⏳ 실시간 데이터 로딩 중...</p>';
    adminUsersListener = firebase.database().ref("/users").on("value", async snapshot => {
        try {
            const usersData = snapshot.val() || {};
            listEl.innerHTML = "";
            let count = 0;
            
            for (const [uid, info] of Object.entries(usersData)) {
                // 마스터 계정 제외, 승인된 사용자 모두 표시 (role 필드 없어도 됨)
                const isMaster = info.email === MASTER_EMAIL || info.role === "master";
                if (info.approved === true && !isMaster) {
                    count++;
                    const time = info.approvedAt ? new Date(info.approvedAt).toLocaleString("ko-KR") : "시간 미상";
                    const safeEmail = escapeHtml(info.email || "알 수 없음");
                    const safeUid = escapeHtml(uid);
                    const row = document.createElement("div");
                    row.className = "pending-user-row";
                    const revokeBtn = document.createElement("button");
                    revokeBtn.className = "btn-reject";
                    revokeBtn.textContent = "🔴 박탈";
                    revokeBtn.dataset.uid = uid;
                    revokeBtn.dataset.email = info.email || "";
                    revokeBtn.addEventListener("click", function() {
                        revokeUser(this.dataset.uid, this.dataset.email);
                    });
                    
                    const infoDiv = document.createElement("div");
                    infoDiv.className = "pending-user-info";
                    infoDiv.innerHTML = `
                        <div class="pending-user-email">
                            ${safeEmail}
                            <span style="background:#10b981; color:white; font-size:10px; padding:2px 6px; border-radius:4px; margin-left:4px;">승인됨</span>
                        </div>
                        <div class="pending-user-time">승인 일시 ${escapeHtml(time)}</div>
                    `;
                    row.appendChild(infoDiv);
                    row.appendChild(revokeBtn);
                    listEl.appendChild(row);
                }
            }
            if (count === 0) {
                listEl.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:28px 0;">✅ 승인된 일반 사용자가 없습니다.</p>';
            }
        } catch(e) {
            console.error("loadApprovedUsers 에러:", e);
            if (e.code === 'PERMISSION_DENIED') {
                listEl.innerHTML = '<p style="color:#fca5a5;text-align:center;padding:20px 0;">에러: 관리자 권한이 없습니다.</p>';
            } else {
                listEl.innerHTML = `<p style="color:#fca5a5;text-align:center;padding:20px 0;">에러: ${escapeHtml(e.message)}</p>`;
            }
        }
    });
}

async function revokeUser(uid, email) {
    if (!(await _checkAdminPermission())) return;
    showModal("권한 박탈", `<b>${escapeHtml(email)}</b>의 권한을 박탈하시겠습니까?`, async () => {
        closeModal();
        try {
            // 기존 데이터를 유지하면서 approved만 변경
            await firebase.database().ref("/users/" + uid).update({ approved: false, revokedAt: Date.now() });
        } catch(e) { alert("에러: " + e.message); }
    });
}

async function restoreUser(uid, email) {
    if (!(await _checkAdminPermission())) return;
    showModal("권한 복구", `<b>${escapeHtml(email)}</b> 사용자를 다시 승인하시겠습니까?`, async () => {
        closeModal();
        try {
            // 기존 데이터를 유지하면서 approved만 변경
            await firebase.database().ref("/users/" + uid).update({ approved: true, approvedAt: Date.now() });
            await firebase.database().ref("/pending_users/" + uid).remove();
            alert("✅ " + email + " 승인되었습니다.");
        } catch(e) { alert("에러: " + e.message); }
    });
}

async function reRequestReactivation() {
    if (!_fbAuth || !_fbAuth.currentUser) return;
    const user = _fbAuth.currentUser;
    try {
        await firebase.database().ref("/pending_users/" + user.uid).set({ 
            email: user.email, 
            displayName: user.displayName || user.email.split("@")[0], 
            requestedAt: Date.now(),
            requestType: "reactivation"
        });
        alert("권한 복구를 다시 요청했습니다.");
        document.querySelector('#revoked-view .auth-card').querySelectorAll('button').forEach(b => b.disabled = false);
    } catch (e) {
        alert("재요청 실패: " + e.message);
    }
}

function openAdminPanel() {
    document.getElementById("admin-panel-overlay").style.display = "flex";
    loadPendingUsers();
}
function closeAdminPanel() {
    document.getElementById("admin-panel-overlay").style.display = "none";
}

function loadPendingUsers() {
    const listEl = document.getElementById("pending-user-list");
    
    if (adminPendingListener) return;
    
    listEl.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:20px 0;">⏳ 실시간 데이터 로딩 중...</p>';
    adminPendingListener = firebase.database().ref("/pending_users").on("value", async snapshot => {
        try {
            const data = snapshot.val() || {};
            const usersSnap = await firebase.database().ref("/users").once("value");
            const usersData = usersSnap.val() || {};
            
            if (Object.keys(data).length === 0) {
                listEl.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:28px 0;">✅ 대기 중인 가입 요청이 없습니다.</p>';
                return;
            }
            listEl.innerHTML = "";
            let hasPending = false;
            
            for (const [uid, info] of Object.entries(data)) {
                if (usersData[uid] && usersData[uid].approved === true) {
                    firebase.database().ref("/pending_users/" + uid).remove().catch(()=>{});
                    continue;
                }
                
                hasPending = true;
                const time = info.requestedAt ? new Date(info.requestedAt).toLocaleString("ko-KR") : "시간 미상";
                const safeEmail = escapeHtml(info.email || "알 수 없음");
                const row = document.createElement("div");
                row.className = "pending-user-row";
                row.innerHTML = `
                    <div class="pending-user-info">
                        <div class="pending-user-email">
                            ${safeEmail}
                            ${info.requestType === 'reactivation' 
                                ? '<span style="background:#f59e0b; color:white; font-size:10px; padding:2px 6px; border-radius:4px; margin-left:4px;">복구 요청</span>'
                                : (info.requestType === 're-request'
                                    ? '<span style="background:#10b981; color:white; font-size:10px; padding:2px 6px; border-radius:4px; margin-left:4px;">재가입 요청</span>'
                                    : '<span style="background:#3b82f6; color:white; font-size:10px; padding:2px 6px; border-radius:4px; margin-left:4px;">신규 가입</span>')}
                        </div>
                        <div class="pending-user-time">최초 요청 일시 ${escapeHtml(time)}</div>
                    </div>
                    <button class="btn-approve" onclick="approveUser('${escapeHtml(uid)}','${safeEmail.replace(/'/g, "\'")}')">✅ 승인</button>
                    <button class="btn-reject" onclick="rejectUser('${escapeHtml(uid)}','${safeEmail.replace(/'/g, "\'")}')">❌ 거절</button>
                `;
                listEl.appendChild(row);
            }
            
            if (!hasPending) {
                listEl.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:28px 0;">✅ 대기 중인 가입 요청이 없습니다.</p>';
            }
        } catch(e) {
            console.error("loadPendingUsers 에러:", e);
            if (e.code === 'PERMISSION_DENIED') {
                listEl.innerHTML = '<p style="color:#fca5a5;text-align:center;padding:20px 0;">에러: 관리자 권한이 없습니다.</p>';
            } else {
                listEl.innerHTML = `<p style="color:#fca5a5;text-align:center;padding:20px 0;">에러: ${escapeHtml(e.message)}</p>`;
            }
        }
    });
}

async function approveUser(uid, email) {
    if (!(await _checkAdminPermission())) return;
    showModal("가입 승인", `<b>${escapeHtml(email)}</b> 가입을 승인하시겠습니까?`, async () => {
        closeModal();
        try {
            await firebase.database().ref("/users/" + uid).set({ email, approved: true, role: "user", approvedAt: Date.now() });
            await firebase.database().ref("/pending_users/" + uid).remove();
            alert("✅ " + email + " 승인되었습니다.");
        } catch(e) { alert("에러: " + e.message); }
    });
}

async function rejectUser(uid, email) {
    if (!(await _checkAdminPermission())) return;
    showModal("가입 거절", `<b>${escapeHtml(email)}</b> 가입 요청을 거절하시겠습니까?`, async () => {
        closeModal();
        try {
            await firebase.database().ref("/users/" + uid).set({ email: email, approved: false, rejectedAt: Date.now() });
            await firebase.database().ref("/pending_users/" + uid).remove();
            alert("❌ " + email + " 요청이 거절되었습니다.");
        } catch(e) { alert("에러: " + e.message); }
    });
}



// --- 계정 관리 로직 ---
function openAccountModal() {
    const user = _fbAuth ? _fbAuth.currentUser : null;
    if (user) {
        document.getElementById("account-email-display").textContent = user.email || "이메일 정보 없음";
    }
    document.getElementById("account-error-msg").style.display = "none";
    document.getElementById("account-new-pw").value = "";
    document.getElementById("account-new-pw-confirm").value = "";
    
    const modal = document.getElementById("account-modal");
    if(modal) {
        modal.classList.add("show");
    }
}

function closeAccountModal() {
    const modal = document.getElementById("account-modal");
    if(modal) {
        modal.classList.remove("show");
    }
}

async function addPasswordToAccount() {
    const user = _fbAuth ? _fbAuth.currentUser : null;
    if (!user) return;
    
    const pw1 = document.getElementById("account-new-pw").value;
    const pw2 = document.getElementById("account-new-pw-confirm").value;
    const msg = document.getElementById("account-error-msg");
    
    if (!pw1 || pw1.length < 6) {
        msg.textContent = "비밀번호는 6자리 이상이어야 합니다.";
        msg.style.display = "block";
        return;
    }
    if (pw1 !== pw2) {
        msg.textContent = "비밀번호 확인이 일치하지 않습니다.";
        msg.style.display = "block";
        return;
    }
    
    msg.style.display = "none";
    try {
        await user.updatePassword(pw1);
        closeAccountModal();
        alert("이메일 로그인용 비밀번호가 성공적으로 설정되었습니다!\n이제 구글 버튼을 누르지 않아도 이메일과 비밀번호로 로그인할 수 있습니다.");
    } catch(err) {
        console.error(err);
        if (err.code === 'auth/requires-recent-login') {
            msg.textContent = "보안을 위해 다시 로그인한 후 비밀번호를 설정해주세요.";
        } else {
            msg.textContent = err.message || "비밀번호 설정 중 오류가 발생했습니다.";
        }
        msg.style.display = "block";
    }
}
